# Despliegue continuo: build → GHCR → Kubernetes en VM vía SSH
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     — IP o hostname de la VM con Kubernetes (ej. 192.168.56.103)
#   DEPLOY_USER     — Usuario SSH (ej. deploy)
#   DEPLOY_SSH_KEY  — Clave privada PEM para autenticación SSH
#   DEPLOY_PATH     — (opcional) Ruta del clone del repo en la VM; default: /opt/almacenamiento-seguro
#
# Bootstrap one-time en la VM (ver README § Despliegue continuo):
#   minikube + Calico, secrets K8s, imagePullSecret ghcr-secret (si el paquete GHCR es privado)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/inventario-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: app/inventario-web
        run: mvn verify

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: app/inventario-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/almacenamiento-seguro"
            fi
            cd "$DEPLOY_PATH"
            git pull origin main
            bash scripts/deploy-k8s.sh "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

spring:
  application:
    name: inventario-seguro

  datasource:
    url: jdbc:sqlserver://192.168.56.101:1433;databaseName=inventario_egi;encrypt=false;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:Itu12345!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27018/inventario_egi}

  jackson:
    property-naming-strategy: SNAKE_CASE

  ldap:
    urls: ${LDAP_URLS:ldap://localhost:389}
    base: ${LDAP_BASE:dc=itu,dc=local}
    username: ${LDAP_BIND_DN:cn=admin,dc=itu,dc=local}
    password: ${LDAP_BIND_PASSWORD:adminpassword}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:SecretKeyForEGIIinventarioSeguroNeedsToBeAtLeast32BytesLongSecretKeyForEGIIinventarioSeguroNeedsToBeAtLeast32BytesLong}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    ldap:
      user-search-base: ${LDAP_USER_SEARCH_BASE:ou=Users}
      user-search-filter: ${LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
      group-search-base: ${LDAP_GROUP_SEARCH_BASE:ou=Groups,ou=Laboratorios,ou=ITU}
      group-search-filter: ${LDAP_GROUP_SEARCH_FILTER:(member={0})}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO

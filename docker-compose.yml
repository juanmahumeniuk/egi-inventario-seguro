services:

  mongodb:
    image: mongo:7
    container_name: egi-mongodb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./app/inventario-web
    container_name: egi-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/inventario_egi}
      DB_URL: ${DB_URL:?DB_URL is required — set the external SQL Server VM connection string in .env}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./app/inventario-web/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    container_name: egi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:

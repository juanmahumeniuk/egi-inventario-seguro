services:

  mongodb:
    image: mongo:7
    container_name: egi-mongodb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: egi-sqlserver
    environment:
      SA_PASSWORD: "${DB_PASSWORD:-EGI_Password123!}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD:-EGI_Password123!}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./docker/sqlserver/init.sql:/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "${DB_PASSWORD:-EGI_Password123!}", "-C", "-i", "/init.sql"]
    restart: "no"

  backend:
    build: ./app/inventario-web
    container_name: egi-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/inventario_egi}
      DB_URL: ${DB_URL:-jdbc:sqlserver://sqlserver:1433;databaseName=inventario_egi;encrypt=false;trustServerCertificate=true}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-EGI_Password123!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

volumes:
  mongo-data:
  sqlserver-data:
